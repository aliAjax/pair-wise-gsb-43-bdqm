<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}.frozen{color:#b3261e;font-weight:600}code{background:#edf0f2;padding:2px 5px}</style>
<h1>公共采购密封投标与评审</h1><div class="card">开标即定批：批次固定参与投标、评分项与项目版本；评分带重试编号且只认当前批；投诉受理先冻结授标再另开批次。写接口需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审批次</th><th>版本</th><th>授标冻结</th></tr></thead><tbody></tbody></table>
<h2>评审批次</h2><table id="batches"><thead><tr><th>项目</th><th>批次</th><th>状态</th><th>来源</th><th>创建时间</th><th>完成时间</th><th>封存时间</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody></tbody></table>
<script>async function load(){const d=await fetch('/api/state').then(r=>r.json());document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr><td>${r.tender_no}</td><td>${r.title}</td><td>${r.status}</td><td>${r.deadline}</td><td>${r.evaluation_round||'-'}</td><td>${r.version}</td><td>${r.award_frozen?'<span class=frozen>已冻结</span>':'否'}</td></tr>`).join('');document.querySelector('#batches tbody').innerHTML=(d.batches||[]).map(r=>`<tr><td>${r.tender_id}</td><td>#${r.batch_no}</td><td>${r.status}</td><td>${r.reason}</td><td>${r.created_at||''}</td><td>${r.completed_at||''}</td><td>${r.superseded_at||''}</td></tr>`).join('');document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${r.status}</td><td>${(r.payload_hash||'').slice(0,12)}…</td></tr>`).join('')}load()</script></html>
